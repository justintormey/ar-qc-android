name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs (both flavors)
        run: ./gradlew assembleQcDebug assembleBuilderDebug --no-daemon

      - name: Upload QC APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-qc-debug-${{ github.sha }}
          path: app/build/outputs/apk/qc/debug/app-qc-debug.apk
          if-no-files-found: error

      - name: Upload Builder APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-debug-${{ github.sha }}
          path: app/build/outputs/apk/builder/debug/app-builder-debug.apk
          if-no-files-found: error
